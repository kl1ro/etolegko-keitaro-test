services:
  db:
    image: postgres:17
    env_file: .env

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]

    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  studio:
    build: ./studio
    env_file: .env
    profiles: ["studio"]

    ports:
      - "127.0.0.1:5555:5555"

    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  db-data:
