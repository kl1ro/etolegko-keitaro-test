name: CI

on:
  push:
    branches: [main]

  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app alembic

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx next typegen
      - run: npx eslint .
      - run: npx tsc --noEmit

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [backend, frontend, studio]

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}

          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest

          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  migrate:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - run: echo "No servers yet. Would run alembic upgrade head from ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}"

  deploy:
    needs: migrate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - run: echo "No servers yet. Would deploy ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} and ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}"
